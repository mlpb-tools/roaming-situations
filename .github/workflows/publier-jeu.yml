
name: Publier le Jeu des situations ROAMING

on:
  push:
    branches: [main]
    paths:
      - ROAMING_site_a_publier.zip
      - .github/workflows/publier-jeu.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Préparer le site
        run: |
          mkdir -p _site
          unzip -q ROAMING_site_a_publier.zip -d _site
          test -f _site/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
